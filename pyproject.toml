[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "aplos"
version = "0.1.0"
description = "Production-oriented PyTorch model scaffolds and research blocks"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
plot = [
    "matplotlib<=3.9",
]
triton = [
    "triton>=3.2",
]
ui = [
    "dearpygui",
    "streamlit",
    "matplotlib<=3.9",
]
full = [
    "matplotlib<=3.9",
    "triton>=3.2",
    "dearpygui",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["."]
